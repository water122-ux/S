name: Build Easy Jukebox

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode Mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: latest

      - name: Upload GEODE
        uses: actions/upload-artifact@v4
        with:
          name: EasyJukebox-Android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error













